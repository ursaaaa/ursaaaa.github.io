<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ site.Title }}{{ else }}{{ with .Title }}{{ . }} · {{ end }}{{ site.Title }}{{ end }}{{ end }}</title>
  {{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ if .Store.Get "hasMermaid" }}
  <script src="{{ "js/mermaid.min.js" | relURL }}"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
      gitGraph: { rotateCommitLabel: false },
    });
  </script>
  {{ end }}
</body>
</html>
